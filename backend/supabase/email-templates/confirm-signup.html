<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:24px 12px;background:#071510;color:#eef8f3;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;margin:0 auto;background:#0b261a;border:1px solid #174633;border-radius:16px">
    <tr><td align="center" style="padding:32px 24px 18px">
      <strong style="color:#f1faf5;font-size:20px;letter-spacing:.12em">ARBORIS<span style="color:#21d991">.X</span></strong>
      <p style="margin:8px 0 0;color:#a6c5b4;font-size:11px;letter-spacing:.14em">INTELIGÊNCIA AMBIENTAL</p>
    </td></tr>
    <tr><td style="padding:10px 24px 32px;text-align:center">
      <h1 style="margin:0 0 16px;color:#f1faf5;font-size:24px">Confirme seu e-mail</h1>
      <p style="margin:0 0 24px;color:#d7e8df;font-size:15px;line-height:1.6">Confirme seu endereço para começar a usar o Arboris.X.</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:13px 24px;border-radius:9px;background:#21d991;color:#052418;text-decoration:none;font-weight:700">Confirmar e-mail</a>
      <p style="margin:24px 0 0;color:#a6c5b4;font-size:12px;line-height:1.5">Não criou uma conta? Ignore este e-mail.</p>
    </td></tr>
  </table>
</body>
</html>
